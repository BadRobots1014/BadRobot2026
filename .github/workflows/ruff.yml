name: Ruff
on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run Ruff
        uses: astral-sh/ruff-action@v1
        continue-on-error: true
        with:
          args: "check"

      - name: Check Formatting
        uses: astral-sh/ruff-action@v1
        continue-on-error: true
        with:
          args: "format --check"
